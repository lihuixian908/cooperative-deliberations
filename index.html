<body><header class="topbar"><div class="brand">合作社的三场商议<small>跨年独立行动版 · 1953—1962</small></div><div class="top-actions"><button data-action="rules">完整规则</button><button data-action="ledger">本轮四组账目</button><button data-action="history" id="history-button" hidden>历轮记录</button><button data-action="fullscreen">全屏投影</button><button data-action="reset">重新开始</button></div></header><main class="shell"><div class="status-line"><span id="save-status">单机主持 · 可离线使用</span><div class="resource" id="resource"></div></div><div id="timeline"></div><div id="app"></div><footer class="footer"><span>虚构基层场景 · 据导修材料设计 · 数值与机制为课堂设定</span><span>每轮代表性农忙安排 · 累计工分不等于十年实际收入</span></footer></main><dialog id="dialog" aria-labelledby="dialog-title"><header class="dialog-head"><h2 id="dialog-title"></h2><button data-action="close" aria-label="关闭对话框">关闭</button></header><div class="dialog-body" id="dialog-body"></div></dialog><noscript><p>请启用浏览器的 JavaScript 后运行游戏。</p></noscript><script id="game-engine">'use strict';

const GRANTS = [6, 4, 3];
const ERAS = [
  {years:'1953—1955', title:'合作化起步', theme:'加入集体，争取机会，建立初步安排', context:'合作化逐步推进。劳动机会、家庭支持和组织资源需要具体安排。'},
  {years:'1956—1957', title:'制度落实', theme:'承诺能否落实，配套能否继续', context:'同工同酬、岗位和照料支持进入实际执行。前期经验与组织记录可以降低延续成本。'},
  {years:'1958—1962', title:'公社化及调整', theme:'资源承压，哪些安排能够维持', context:'基层组织经历变化与调整。本轮新增组织资源减少，已有安排需要重新确认与投入。'}
];
const ROLES = [
  {name:'争取岗位的女社员',color:'#873d3d',interest:'选择劳动与岗位，积累经验，也考虑家务和学习负担。'},
  {name:'承担主要照料的女社员',color:'#315f50',interest:'在个人所得、家庭事务和照料支出之间选择；与第三组协商。'},
  {name:'家庭主要男劳动力',color:'#8a612d',interest:'与第二组属于同一家庭；决定出工、费用、家庭分担和带工责任。'},
  {name:'基层生产组织负责人',color:'#3d5b72',interest:'前期为合作社主任；组织评工、岗位与照料，保留后续资源。'}
];
const CHOICES = {
  youthAction:[['ordinary','A · 全天普通劳动'],['practice','B · 申请重活实践／继续岗位'],['rest','C · 半天普通劳动，半天家务与休整']],
  motherAction:[['home','A · 自己处理家庭事务，出工半天'],['private','B · 邻里付酬照料，出工全天'],['public','C · 使用集体照料，出工全天'],['family','D · 请男社员分担，出工全天']],
  motherFallback:[['home','备用 · 自己处理家庭事务，出工半天'],['privateSelf','备用 · 邻里照料，自己付全部4分']],
  maleAction:[['assigned','A · 接受最终派工，出工全天'],['heavyOnly','B · 只接受分到的重活'],['care','C · 半天重活，分担家庭事务与一项晚间家务']],
  maleFallback:[['assigned','备用 · 接受最终派工'],['heavyOnly','备用 · 只接受分到的重活']],
  evaluation:[[0,'沿用原差别计价 · 0点'],[1,'仅第一组落实统一标准 · 1点'],[2,'两组女社员均落实统一标准']],
  job:[[false,'不提供岗位支持 · 0点'],[true,'提供岗位支持 · 按经验与带工核算']],
  publicCare:[[false,'不开办集体照料 · 0点'],[true,'开办／维持集体照料']],
  maleFee:[0,1,2,3,4].map(n=>[n,`男方付${n}分，女方付${4-n}分`])
};
const FIELD_LABELS = {youthAction:'第一组 · 劳动行动',motherAction:'第二组 · 照料行动',motherFallback:'第二组 · 备用行动',maleAction:'第三组 · 劳动行动',maleFallback:'第三组 · 备用行动',evaluation:'第四组 · 评工安排',job:'第四组 · 岗位支持',publicCare:'第四组 · 集体照料',maleFee:'第二、三组 · 费用分担'};
const AGREEMENTS = {
  family:{name:'家庭分担协议',signers:[1,2],text:'第二组选择家庭分担、第三组接手半日家庭事务及一项晚间家务，双方确认后执行。'},
  fee:{name:'照料费用协议',signers:[1,2],text:'邻里照料合计4分。男方承担费用需双方确认当前数额；女方自付4分可自行选择。'},
  mentor:{name:'带工协议',signers:[0,2],text:'经验不足2点且实际参加岗位实践时，男社员额外指导：岗位成本减1点，学习负担减1点，指导者负担加1点。'}
};
const ENDINGS = [
  ['评价落差长期延续','三轮未同时覆盖两组女社员。部分人的机会或所得可能改善，评价覆盖的落差仍持续存在。'],
  ['改善曾经发生，随后回退','曾落实两组统一评工，第三轮未继续。前期改善留下记录，也暴露出制度延续的困难。'],
  ['制度有所改善，家庭事务长期限制参与','第三轮已落实两组统一评工，但主要照料者三轮最多只有一轮全天出工。制度承诺仍受到家庭事务安排的限制。'],
  ['参与扩大，个人回报仍然偏低','主要照料者至少两轮全天出工，三轮个人净得仍少于18分。动员出工、个人所得与家庭总所得需要分别看待。'],
  ['改善已经出现，制度或岗位尚未稳定','个人回报有所改善，但两组统一评工仅落实一轮，或岗位经验尚未转化为第三轮正式安排。最后一轮的进展没有抹去前期的缺口。'],
  ['机会与回报改善，照料仍缺少持续配套','评价与岗位改善跨轮落实，第二、三轮尚未连续采用家庭分担或集体支持。付酬照料与安排转换的成本仍需继续协调。'],
  ['支持持续，家庭分担有所改变','第二、三轮均获得家庭或集体照料支持，第三轮由家庭接手。个人所得、家庭所得与承担责任者的负担可能朝不同方向变化。'],
  ['支持持续，集体服务发挥作用','评价、岗位与照料支持形成多阶段落实，第三轮集体服务实际发挥作用。晚间家务、无工分指导与照料人员的劳动仍需要被看见。']
];
function freshPlan(){return {youthAction:'ordinary',motherAction:'home',motherFallback:'home',maleAction:'assigned',maleFallback:'assigned',evaluation:0,job:false,publicCare:false,maleFee:0};}
function emptyAgreements(){return {family:[false,false],fee:[false,false],mentor:[false,false]};}
function approved(pair){return pair.every(v=>v===true);}
function validPlan(p){return p&&Object.keys(CHOICES).every(k=>CHOICES[k].some(([v])=>v===p[k]));}
function validAgreements(a){return a&&Object.keys(AGREEMENTS).every(k=>Array.isArray(a[k])&&a[k].length===2&&a[k].every(v=>typeof v==='boolean'));}
function choiceTitle(k,v){return CHOICES[k].find(o=>o[0]===v)?.[1]??'未选择';}
function freshCareer(){return {rounds:0,reserve:0,skill:0,points:[0,0,0],burdens:[0,0,0],field:0,collective:0,neighbor:0,careCredit:0,evaluations:[],publicOpened:[],modes:[],motherFull:0,familyCount:0,feeCount:0,feeTotal:0,mentorCount:0,restCount:0,unusedCount:0,youthEqualCount:0,formalLast:false};}
function resolveRound(before,plan,agreements){
  if(!validPlan(plan)||!validAgreements(agreements)||before.rounds>2)throw Error('本轮安排无效');
  const round=before.rounds,available=before.reserve+GRANTS[round];
  const reasons=[[],[],[],[]];
  let mode=plan.motherAction, family=mode==='family'&&plan.maleAction==='care'&&approved(agreements.family);
  let failure='';
  if(mode==='public'&&!plan.publicCare)failure='第四组未开办集体照料';
  if(mode==='family'&&!family)failure=plan.maleAction!=='care'?'第三组未选择家庭分担':'家庭分担尚未获得双方同意';
  if(mode==='private'&&plan.maleFee>0&&!approved(agreements.fee))failure='当前费用分担尚未获得双方同意';
  let motherFee=0,maleFee=0;
  if(failure){mode=plan.motherFallback==='home'?'home':'private';motherFee=mode==='private'?4:0;family=false;reasons[1].push(`${failure}；执行${choiceTitle('motherFallback',plan.motherFallback)}。`);}
  else if(mode==='private'){maleFee=plan.maleFee;motherFee=4-maleFee;}
  const feeAgreement=mode==='private'&&maleFee>0;
  let maleAction=plan.maleAction;
  if(maleAction==='care'&&!family){maleAction=plan.maleFallback;reasons[2].push(`家庭分担未执行；执行${choiceTitle('maleFallback',plan.maleFallback)}。`);}
  let youthAction=plan.youthAction;
  if(youthAction==='practice'&&!plan.job){youthAction='ordinary';reasons[0].push('岗位支持未落实；执行固定备用：全天普通劳动。');}
  const practice=youthAction==='practice',formal=practice&&before.skill>=2,mentor=practice&&!formal&&approved(agreements.mentor);
  const youthField=youthAction==='rest'?1:2,youthHeavy=practice?1:0;
  const youthDaily=plan.evaluation>0?10:6;
  const youthPoints=youthAction==='rest'?youthDaily/2:practice?youthDaily+1:youthDaily;
  let maleField=2,maleHeavy=practice?1:2,maleGross=practice?11:12;
  if(maleAction==='heavyOnly'){maleField=maleHeavy;maleGross=maleHeavy*6;}
  if(maleAction==='care'){maleField=1;maleHeavy=1;maleGross=6;}
  if(practice&&maleAction==='assigned')reasons[2].push('一个半日重活已安排给第一组；接受半天重活、半天普通劳动，记11分。');
  if(practice&&maleAction==='heavyOnly')reasons[2].push('只接剩余半日重活；不补普通劳动，实际出工半天、记6分。');
  const motherField=mode==='home'?1:2,motherGross=(plan.evaluation===2?10:6)*motherField/2;
  const motherNet=motherGross-motherFee,maleNet=maleGross-maleFee;
  const burdenDelta=[youthAction==='rest'?1:practice&&!formal&&!mentor?3:2,mode==='home'?3:family?1:2,(family?3:1)+(mentor?1:0)];
  const evaluationCost=plan.evaluation===2?(before.evaluations.at(-1)===2?1:2):plan.evaluation;
  const jobCost=plan.job?(before.skill>=2?1:2-(mentor?1:0)):0;
  const publicCareCost=plan.publicCare?(before.publicOpened.at(-1)?2:3):0;
  const spent=evaluationCost+jobCost+publicCareCost,remaining=available-spent;
  const unused=[];
  if(plan.job&&!practice)unused.push('岗位支持已组织却未使用，仍扣岗位成本。');
  if(plan.publicCare&&mode!=='public')unused.push('集体照料已组织却未使用，仍扣组织成本；示范账不新增照料记工。');
  reasons[3].push(...unused);
  if(plan.job&&before.skill<2&&!mentor)reasons[3].push('未实际执行带工，岗位按2点核算。');
  const fieldTotal=youthField+motherField+maleField,careCredit=mode==='public'?4:0,neighbor=mode==='private'?4:0;
  const collective=youthPoints+motherGross+maleGross+careCredit;
  const after=structuredClone(before);
  after.rounds++;after.reserve=remaining;after.skill=Math.min(3,before.skill+(practice?1:0));
  [youthPoints,motherNet,maleNet].forEach((v,i)=>after.points[i]+=v);
  burdenDelta.forEach((v,i)=>after.burdens[i]+=v);
  after.field+=fieldTotal;after.collective+=collective;after.neighbor+=neighbor;after.careCredit+=careCredit;
  after.evaluations.push(plan.evaluation);after.publicOpened.push(plan.publicCare);after.modes.push(mode);
  after.motherFull+=motherField===2?1:0;after.familyCount+=family?1:0;after.feeCount+=feeAgreement?1:0;after.feeTotal+=maleFee;
  after.mentorCount+=mentor?1:0;after.restCount+=youthAction==='rest'?1:0;after.unusedCount+=unused.length;after.youthEqualCount+=plan.evaluation>0?1:0;after.formalLast=formal;
  const actual=[
    {title:youthAction==='rest'?'半天普通劳动、半天家务与休整':practice?(formal?'继续正式岗位':'参加重活学习实践'):'全天普通劳动',text:`本轮${youthPoints}分，出工${youthField}个半日；经验${before.skill}→${after.skill}，负担＋${burdenDelta[0]}。`},
    {title:{home:'自己处理家庭事务，出工半天',private:'邻里付酬照料，出工全天',public:'使用集体照料，出工全天',family:'家庭重新分担，出工全天'}[mode],text:`毛工分${motherGross}，照料支出${motherFee}，净得${motherNet}；负担＋${burdenDelta[1]}。`},
    {title:family?'半天重活、半天家庭事务及一项晚间家务':maleAction==='heavyOnly'?'只接受分到的重活':'接受最终派工',text:`出工${maleField}个半日，毛工分${maleGross}，照料支出${maleFee}，净得${maleNet}；负担＋${burdenDelta[2]}${mentor?'（含额外带工1点）':''}。`},
    {title:`本轮投入${spent}点，余额${remaining}点`,text:`合计出工${fieldTotal}个半日，集体示范记工${collective}分${careCredit?'（含照料人员4分）':''}。`}
  ];
  return {round,plan:structuredClone(plan),agreements:structuredClone(agreements),before:structuredClone(before),after,available,spent,remaining,valid:remaining>=0,evaluationCost,jobCost,publicCareCost,youthAction,practice,formal,mentor,family,feeAgreement,mode,youthField,youthHeavy,motherField,maleField,maleHeavy,youthPoints,motherGross,motherNet,maleGross,maleNet,motherFee,maleFee,burdenDelta,fieldTotal,careCredit,neighbor,collective,unused,reasons,actual};
}
function replay(records){let career=freshCareer();const results=[];for(const record of records){const result=resolveRound(career,record.plan,record.agreements);if(!result.valid)throw Error('历史预算无效');career=result.after;results.push(result);}return {career,results};}
function careerFacts(c){return {evaluationCount:c.evaluations.filter(v=>v===2).length,finalCovered:c.evaluations.at(-1)===2,fullEnough:c.motherFull>=2,returnEnough:c.points[1]>=18,formal:c.formalLast,continuous:c.modes.length===3&&c.modes.slice(1).every(v=>v==='family'||v==='public'),finalMode:c.modes.at(-1)};}
function endingCatalog(c){
  const f=careerFacts(c),req=(text,met)=>({text,met});
  const covered=req('第三轮两组女社员均落实统一评工',f.finalCovered),full=req('第二组至少两轮全天出工',f.fullEnough),income=req('第二组累计净得至少18分',f.returnEnough),multi=req('两组统一评工至少落实两轮',f.evaluationCount>=2),formal=req('第一组第三轮取得正式岗位（前两轮均积累经验，并继续实际岗位）',f.formal),continuous=req('第二、三轮均实际采用家庭分担或集体照料',f.continuous);
  const base=[covered,full,income],advanced=[...base,multi,formal];
  const mainRules=[
    [req('三轮从未同时覆盖两组女社员',f.evaluationCount===0)],
    [req('此前至少一轮覆盖两组女社员',f.evaluationCount>0),req('第三轮未继续两组统一评工',!f.finalCovered)],
    [covered,req('第二组全天出工不超过一轮',!f.fullEnough)],
    [covered,full,req('第二组累计净得少于18分',!f.returnEnough)],
    [...base,req('统一评工仅落实一轮，或第三轮未取得正式岗位',f.evaluationCount===1||!f.formal)],
    [...advanced,req('第二、三轮未形成连续照料支持',!f.continuous)],
    [...advanced,continuous,req('第三轮实际采用家庭分担',f.finalMode==='family')],
    [...advanced,continuous,req('第三轮实际使用集体照料',f.finalMode==='public')]
  ];
  const roleRules=[
    [
      ['岗位经历形成延续',[formal]],
      ['经验已积累，岗位仍待确认',[req('第三轮未取得正式岗位',!f.formal),req('累计经验至少2点',c.skill>=2)]],
      ['获得过机会，尚未连续积累',[req('累计经验恰为1点',c.skill===1)]],
      ['未形成重活岗位经历',[req('累计经验为0点',c.skill===0)]]
    ],
    [
      ['家庭事务持续挤压参与',[req('全天出工不超过一轮',!f.fullEnough)]],
      ['出工增加，个人回报不足',[full,req('累计净得少于18分',!f.returnEnough)]],
      ['所得改善，较重负担仍在积累',[full,income,req('累计负担至少7点',c.burdens[1]>=7)]],
      ['照料获得持续支持',[full,income,req('累计负担少于7点',c.burdens[1]<7),continuous]],
      ['参与有所扩大，照料成本仍需协调',[full,income,req('累计负担少于7点',c.burdens[1]<7),req('第二、三轮未形成连续照料支持',!f.continuous)]]
    ],
    [
      ['持续参与家庭分担',[req('实际家庭分担至少两轮',c.familyCount>=2)]],
      ['主要通过费用参与支持',[req('家庭分担少于两轮',c.familyCount<2),req('实际承担照料费用至少两轮',c.feeCount>=2)]],
      ['主要通过指导支持岗位开放',[req('家庭分担及付费均少于两轮',c.familyCount<2&&c.feeCount<2),req('实际带工至少两轮',c.mentorCount>=2)]],
      ['支持发生，但尚未持续',[req('家庭分担、付费、带工分别都少于两轮',c.familyCount<2&&c.feeCount<2&&c.mentorCount<2),req('至少实际执行过一次支持',c.familyCount+c.feeCount+c.mentorCount>0)]],
      ['主要维持原有出工安排',[req('未实际执行家庭分担、付费或带工',c.familyCount+c.feeCount+c.mentorCount===0)]]
    ],
    (()=>{const complete=f.evaluationCount>=2&&f.continuous&&f.formal,any=c.youthEqualCount>0||c.skill>0||c.modes.includes('public');return [
      ['本轮安排已结算，后续余量耗尽',[req('最终组织资源为0点',c.reserve===0)]],
      ['多项配套落实，并保留组织余量',[req('最终组织资源至少1点',c.reserve>0),multi,continuous,formal]],
      ['部分改善落地，仍有组织余地',[req('最终组织资源至少1点',c.reserve>0),req('尚未同时满足多项配套条件',!complete),req('至少落实过统一评工、实际岗位或集体照料中的一项',any)]],
      ['资源尚有保留，主要支持未充分落实',[req('最终组织资源至少1点',c.reserve>0),req('未实际落实上述三类主要支持',!any)]]
    ];})()
  ];
  const entry=(title,requirements,id,text='')=>({id,title,requirements,text,matched:requirements.every(r=>r.met)});
  return {main:ENDINGS.map(([title,text],i)=>entry(title,mainRules[i],i,text)),roles:roleRules.map(rows=>rows.map(([title,rs],i)=>entry(title,rs,i)))};
}
function burdenLabel(n){return n>=7?'较重负担持续积累':n>=4?'额外负担持续存在':'本局记录的额外负担较低';}
function historyTags(c){const tags=[];
  if(c.evaluations.some((v,i)=>v===2&&c.evaluations.slice(i+1).includes(0)||v===2&&c.evaluations.slice(i+1).includes(1)))tags.push('两组统一评工曾中断');
  if(c.publicOpened.some((v,i)=>v&&c.publicOpened.slice(i+1).includes(false)))tags.push('集体照料组织曾中断');
  if(c.modes.filter(v=>v==='private').length>=2)tags.push('多轮依靠家庭付酬照料');
  if(c.mentorCount)tags.push(`无工分带工${c.mentorCount}轮`);
  if(c.unusedCount)tags.push(`支持闲置${c.unusedCount}项次`);
  if(c.restCount)tags.push(`第一组减少半日出工${c.restCount}轮`);
  if(c.evaluations[2]===2&&c.evaluations.filter(v=>v===2).length===1)tags.push('直到第三轮才同时覆盖两组');
  return tags;
}
function freshState(){return {version:VERSION,screen:'home',step:'intent',history:[],plan:freshPlan(),agreements:emptyAgreements(),confirmed:[false,false,false,false],notes:['','','']};}
function validateState(s){try{
  if(!s||s.version!==VERSION||!['home','round','ending','discussion'].includes(s.screen)||!['intent','negotiate','confirm','receipt'].includes(s.step)||!Array.isArray(s.history)||s.history.length>3||!validPlan(s.plan)||!validAgreements(s.agreements)||!Array.isArray(s.confirmed)||s.confirmed.length!==4||s.confirmed.some(v=>typeof v!=='boolean')||!Array.isArray(s.notes)||s.notes.length!==3||s.notes.some(v=>typeof v!=='string'))return false;
  const {results}=replay(s.history);
  if(s.screen==='home'&&s.history.length!==0)return false;
  if(['ending','discussion'].includes(s.screen)&&s.history.length!==3)return false;
  if(s.screen==='round'&&s.step!=='receipt'&&s.history.length>=3)return false;
  if(s.screen==='round'&&s.step==='receipt')return results.length>0&&s.confirmed.every(Boolean)&&JSON.stringify(s.history.at(-1).plan)===JSON.stringify(s.plan)&&JSON.stringify(s.history.at(-1).agreements)===JSON.stringify(s.agreements);
  return true;
}catch{return false;}}
</script><script id="game-interface">'use strict';
const STORAGE_KEY='cooperative-crossyear-v4';
const app=document.getElementById('app'),dialog=document.getElementById('dialog');
let state=freshState(),storageAvailable=true,endingCategory='main';
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(validateState(saved))state=saved;}catch{storageAvailable=false;}
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,cls='',extra='')=>`<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`;

function data(){return replay(state.history);}
function roundIndex(){return state.screen==='round'?state.history.length-(state.step==='receipt'?1:0):state.screen==='home'?0:2;}

function head(kicker,title,text){return `<header class="section-head"><div class="eyebrow">${kicker}</div><h2>${title}</h2><p class="lead">${text}</p></header>`;}
function roleCards(){return `<div class="role-grid">${ROLES.map((r,i)=>`<article class="role-card" style="--role:${r.color}"><div class="eyebrow">第${i+1}组</div><h3>${r.name}</h3><p>${r.interest}</p></article>`).join('')}</div>`;}
function eraStrip(){const n=roundIndex();return `<nav class="timeline" aria-label="跨年时间线">${ERAS.map((e,i)=>`<div class="era ${i===n?'active':''} ${state.history.length>i?'completed':''}" ${i===n?'aria-current="step"':''}><span>第${i+1}轮 · ${e.years}</span><b>${e.title}</b><small>${state.history.length>i?'已结算':i===n&&state.screen==='round'?'当前阶段':e.theme}</small></div>`).join('')}</nav>`;}

function careerStats(c){return `<div class="metrics">${stat('累计个人示范工分',c.points.join(' / '),'依次为第1、2、3组')}${stat('岗位经验',`${c.skill} / 3`,'前两轮积累决定第三轮岗位')}${stat('累计负担',c.burdens.join(' / '),'各组分别累积，7点起标记较高')}${stat('夫妻累计合计',c.points[1]+c.points[2],'第二组＋第三组个人净得')}</div>`;}
function homeScreen(){return `<section class="hero"><div><div class="eyebrow">四组独立行动 · 三个历史阶段</div><h1>合作社的<br>三场商议</h1><p class="hero-lead">十年间，劳动机会增加了，<br>谁的生活也随之改变？</p><p>各自选择劳动与照料，在协商中分配费用和责任。前轮的所得、经验、负担与组织资源，会留到下一轮。</p><div class="actions">${button('开始跨年游戏 →','start','primary')}${button('阅读完整规则','rules')}</div></div><aside class="hero-note"><div class="eyebrow">从承诺到长期处境</div><ol><li><b>1953—1955</b><span>加入与机会</span></li><li><b>1956—1957</b><span>制度与落实</span></li><li><b>1958—1962</b><span>压力与调整</span></li></ol><p>结局回望1970年代<br>主持人自主推进，无倒计时</p></aside></section>${roleCards()}<div class="notice">每轮是一套代表性农忙安排，三轮分别记账。具体数值是课堂机制，累计示范工分不等于十年的实际收入。</div>`;}
function optionsFor(field){return CHOICES[field].map(([value,title])=>{let t=title;const c=data().career;

}).join('');}

<section class="action-card" style="--role:${ROLES[3].color}"><div class="eyebrow">第四组 · 组织投入</div><h3>${ROLES[3].name}</h3>${select('evaluation','评工落实')}${select('job','岗位支持')}${select('publicCare','集体照料')}<p class="help">连续落实两组统一评工、连续开办照料可降低成本。已组织的支持即使闲置也扣资源。</p></section>

function budget(r){return `<div class="budget ${r.valid?'':'error'}" ${r.valid?'':'role="alert"'}><div><span>前轮余额 ${r.before.reserve}</span><span>本轮新增 ${GRANTS[r.round]}</span><b>可用 ${r.available}点</b></div><div><span>评工 ${r.evaluationCost}</span><span>岗位 ${r.jobCost}${r.mentor?'（带工减1）':''}</span><span>照料 ${r.publicCareCost}</span><b>投入 ${r.spent} · ${state.step==='receipt'?'余额':'预计余'} ${r.remaining}</b></div>${r.valid?'':`<p>超出预算${-r.remaining}点。第四组须调整投入，或落实符合条件的带工；预算平衡后才能确认执行。</p>`}</div>`;}
function agreements(readonly=false){const r=currentResult();return `<div class="agreement-grid">${Object.entries(AGREEMENTS).map(([key,a])=>{

}).join('')}</div>`;}
function actualCards(r,confirm=false){const proposed=[choiceTitle('youthAction',r.plan.youthAction),choiceTitle('motherAction',r.plan.motherAction),choiceTitle('maleAction',r.plan.maleAction),'评工、岗位、照料三项组织投入'];return `<div class="execution-grid">${ROLES.map((role,i)=>`<article class="execution-card ${confirm&&state.confirmed[i]?'confirmed':''}" style="--role:${role.color}"><div class="eyebrow">第${i+1}组 · ${role.name}</div><p class="requested">意向：${proposed[i]}</p><h3>${r.actual[i].title}</h3><p>${r.actual[i].text}</p>${r.reasons[i].length?`<div class="adjustment">${r.reasons[i].map(s=>`<p>${s}</p>`).join('')}</div>`:''}${confirm?button(state.confirmed[i]?'已确认本组安排 ✓ · 撤回':'确认本组实际行动','confirm-group',state.confirmed[i]?'':'primary',`data-group="${i}" ${r.valid?'':'disabled'}`):''}</article>`).join('')}</div>`;}
function delta(a,b,unit=''){const d=b-a;return `<b>${a} → ${b}${unit}</b><small>${d===0?'不变':d>0?`＋${d}`:`−${-d}`}</small>`;}

<tr><th scope="row">第2组<br>${ROLES[1].name}</th><td>${delta(b.points[1],a.points[1],'分')}<p>本轮净得 ${r.motherNet}</p></td><td>田间 ${r.motherField}个半日<br>本人家庭事务 ${r.mode==='home'?1:0}个半日<br>毛工分 ${r.motherGross} / 支出 ${r.motherFee}</td><td>${delta(b.burdens[1],a.burdens[1],'点')}<p>${r.family?'家庭分担＋1':r.mode==='home'?'自己承担＋3':'照料外移，家务仍在＋2'}</p></td><td>全天出工 ${b.motherFull} → ${a.motherFull}轮<br>夫妻累计 ${b.points[1]+b.points[2]} → ${a.points[1]+a.points[2]}分</td></tr>
<tr><th scope="row">第3组<br>${ROLES[2].name}</th><td>${delta(b.points[2],a.points[2],'分')}<p>本轮净得 ${r.maleNet}</p></td><td>田间 ${r.maleField}个半日<br>家庭事务 ${r.family?1:0}个半日 / 晚间家务 ${r.family?1:0}项<br>费用 ${r.maleFee} / 带工 ${r.mentor?1:0}项</td><td>${delta(b.burdens[2],a.burdens[2],'点')}<p>${r.mentor?'含额外指导＋1':'按本轮实际责任记录'}</p></td><td>家庭分担累计 ${a.familyCount}轮<br>付费 ${a.feeCount}轮 / 带工 ${a.mentorCount}轮</td></tr>
<tr><th scope="row">第4组<br>基层生产组织负责人</th><td>${delta(b.collective,a.collective,'分')}<p>集体示范记工，本轮＋${r.collective}<br>含集体照料记工 ${r.careCredit}</p></td><td>三人合计 ${r.fieldTotal}个半日<br>累计 ${b.field} → ${a.field}个半日</td><td>支持闲置 ${r.unused.length}项<br>照料人员劳动另行记工</td><td>前轮余 ${b.reserve}＋新增 ${GRANTS[r.round]}<br>可用 ${r.available} → 余 ${a.reserve}点<br>两组统一评工累计 ${a.evaluations.filter(v=>v===2).length}轮</td></tr>
</tbody></table></div><p class="help">${r.mode==='private'?`家庭合计转付4分给非玩家照料者（女方${r.motherFee}、男方${r.maleFee}）；费用分担不改变家庭总支出。`:r.mode==='public'?'集体照料由非玩家照料人员承担，实际新增记工4分；晚间家务仍需处理。':r.family?'男社员接手半日家庭事务与一项晚间家务，夫妻出工和个人所得分别核算。':'女社员自己处理一格家庭事务，出工半天。'} 工分为三次代表性安排的示范记账，不能换算十年实际收入。</p></section>`;}
function roundScreen(){const i=roundIndex(),e=ERAS[i],r=currentResult();
  if(state.step==='receipt')return `${head(`第${i+1}轮 · ${e.years} · 已结算`,'这一阶段，谁获得了什么，又承担了什么？','工分、经验、负担和资源已经更新。下一轮将继承这些结果。')}${budget(r)}${ledger(r)}<div class="actions split">${button('返回本轮修改','revise')}${i<2?button(`进入第${i+2}轮 · ${ERAS[i+1].years} →`,'next','primary'):button('揭晓长期结局 →','ending','primary')}</div>`;

  ${state.step==='confirm'?`${budget(r)}${actualCards(r,true)}${agreements(true)}<div class="actions split">${button('返回协商调整','back-negotiate')}<div>${pill(`已确认 ${state.confirmed.filter(Boolean).length} / 4`)} ${button('正式执行并展示四组变化 →','settle','primary',r.valid&&state.confirmed.every(Boolean)?'':'disabled')}</div></div>`:`${actionForms()}${state.step==='negotiate'?agreements():`<div class="notice compact">各组先独立登记，再公布意向进入协商。协议尚未确认时，试算按各自备用行动显示。</div>`}${budget(r)}${state.step==='negotiate'?`<label class="note-label">本轮协商记录（可选）<textarea data-note="${i}" aria-label="本轮协商记录" placeholder="记录承诺、分歧或选择理由">${esc(state.notes[i])}</textarea></label>`:''}${actualCards(r)}<div class="actions split">${button('查看本轮四组试算账','ledger')}<div>${state.step==='negotiate'?button('返回独立登记','back-intent'):''} ${button(state.step==='intent'?'公布意向，进入协商 →':'进入分别确认 →',state.step==='intent'?'negotiate':'confirm','primary',state.step==='negotiate'&&!r.valid?'disabled':'')}</div></div>`}`;

function roleSummary(c,i){const facts=careerFacts(c);if(i===0)return `累计工分${c.points[0]}，岗位经验${c.skill}点；采用统一计价${c.youthEqualCount}轮。累计负担${c.burdens[0]}：${burdenLabel(c.burdens[0])}。`;

}
function endingScreen(){const c=data().career,cat=endingCatalog(c),main=cat.main.find(x=>x.matched);return `${head('到1962年前后 · 长期结局','三轮经历，留下了怎样的变化？','主结局、四组处境与负担记录共同组成结果。最后一轮的安排不会删除前期经历。')}<div class="actions">${button('查看全部结局与达成要求','all-endings','primary')}${button('查看三轮账目与协商记录','history')}</div><section class="result-hero"><div class="eyebrow">合作社主结局 · ${main.id+1} / 8</div><h2>${main.title}</h2><p>${main.text}</p><div class="pills">${historyTags(c).map(t=>pill(t)).join('')}</div></section>${careerStats(c)}<div class="role-results">${ROLES.map((r,i)=>`<article class="role-result" style="--role:${r.color}"><div class="eyebrow">第${i+1}组 · ${r.name}</div><h3>${cat.roles[i].find(x=>x.matched).title}</h3><p>${roleSummary(c,i)}</p></article>`).join('')}</div><div class="notice">第1、2组下工后的家庭劳动仍有记录；集体照料也由其他劳动者承担。制度配套形成，不等于性别平等已经实现。</div><div class="actions split">${button('重选第三轮，保留前两轮','revise-final')}${button('进入1970年代回望 →','discussion','primary')}</div>`;}
function discussionScreen(){return `${head('1970年代回望 · 课堂讨论','制度的理想，怎样成为不同人的现实？','回望是根据本局经历作出的有条件推演，不宣称1962年后的历史会按游戏安排固定发展。')}<p class="big-question">机会和收入增加以后，<br>家庭中的劳动分担也改变了吗？</p><div class="discussion-grid"><article><span>01</span><h3>哪些改善有了延续？</h3><p>对照三轮记录，看看评工、岗位和照料的支持如何建立、停止或恢复。</p></article><article><span>02</span><h3>配套依靠谁的劳动？</h3><p>看看家庭事务、照料费用和无工分指导由谁承担。个人所得与家庭合计是否一致变化？</p></article><article><span>03</span><h3>如果这些安排继续</h3><p>妇女增加的出工和收入，能否同时带来长期家庭负担的改变？还缺少什么条件？</p></article></div><div class="actions">${button('返回长期结局','ending','primary')}${button('查看全部结局与达成要求','all-endings')}${button('查看三轮账目','history')}</div>`;}
function render(){document.body.dataset.view=state.screen==='round'?state.step:state.screen;document.getElementById('timeline').innerHTML=state.screen==='home'?'':eraStrip();app.innerHTML=state.screen==='home'?homeScreen():state.screen==='round'?roundScreen():state.screen==='ending'?endingScreen():discussionScreen();

function allEndingsHtml(){const c=data().career,cat=endingCatalog(c),roleIndex=Number(endingCategory.replace('role','')),rows=endingCategory==='main'?cat.main:cat.roles[roleIndex];return `<p>每项下列条件须同时满足；按完整三轮正式结果核对。本轮预算均须合法，协议须实际兑现。勾选为本局已满足条件。</p><div class="ending-tabs" aria-label="选择结局类别">${[['main','八类主结局'],...ROLES.map((r,i)=>[`role${i}`,`第${i+1}组`])].map(([key,label])=>button(label,'ending-category','',`data-category="${key}" aria-pressed="${endingCategory===key}"`)).join('')}</div><div class="notice compact">两组统一评工${careerFacts(c).evaluationCount}轮；第二组全天出工${c.motherFull}轮、累计净得${c.points[1]}分；经验${c.skill}点；资源余${c.reserve}点。</div><h3>${endingCategory==='main'?'八类合作社主结局':ROLES[roleIndex].name+' · 角色结局'}</h3>${rows.map(e=>`<article class="ending-entry ${e.matched?'current-ending':''}"><div class="ending-title"><h3>${e.title}</h3>${e.matched?pill('本局结局'):''}</div>${e.text?`<p>${e.text}</p>`:''}<ul class="requirements">${e.requirements.map(r=>`<li class="${r.met?'met':''}"><span>${r.met?'✓ 已满足':'○ 未满足'}</span>${r.text}</li>`).join('')}</ul></article>`).join('')}<p class="help">角色结局还附加负担标签：0—3点较低，4—6点持续存在，7点及以上为较重负担。18分是课堂观察线，不是历史贫困线。</p>`;}

function rulesHtml(){return `<h3>跨年游戏怎样进行</h3><p>四组分别选择行动，公开意向后协商，再各自确认。每个阶段正式结算一次。前三组累计工分与负担，第一组积累经验，第四组资源余额保留。没有共同方案表决、倒计时或超时提交。</p><p>三轮依次为1953—1955、1956—1957、1958—1962；结束后回望1970年代。每轮是代表性农忙安排，数值为课堂设定，不是十年实际收入或真实拨款。第二组孩子会长大，一格家庭事务随阶段代表照料及必要家务。</p>
<h3>每轮资源与组织成本</h3><table><tr><th>轮次</th><th>可用资源</th></tr><tr><td>第一轮</td><td>6点</td></tr><tr><td>第二轮</td><td>前轮余额＋4点</td></tr><tr><td>第三轮</td><td>前轮余额＋3点</td></tr></table><ul><li>原差别计价0点；仅第一组统一1点；两组统一首次或恢复2点，连续维持1点。</li><li>岗位学习2点，实际带工减为1点；本轮开始经验已有2点，提供正式岗位1点。</li><li>集体照料首次或恢复3点，连续开办2点。开办后无人使用也扣成本。</li><li>不能借下一轮资源，工分不能换资源。预算超额时第四组调整投入后再确认。</li></ul>
<h3>记工与岗位冲突</h3><table><tr><th>半日劳动</th><th>女社员原计价</th><th>统一计价</th><th>男社员</th></tr><tr><td>普通劳动</td><td>3</td><td>5</td><td>5</td></tr><tr><td>重活</td><td>4</td><td>6</td><td>6</td></tr></table><p>每人最多两个半日田间劳动。共两个半日重活岗位，第一组获得半日重活后，男社员接受全天派工记11分，只接剩余重活则出工半天记6分。男社员家庭分担时只做半日重活记6分。第一组无岗位支持则执行全天普通劳动；休整行动只做半天普通劳动。</p>
<h3>三项协议与备用</h3><ul><li>家庭分担需第二组选择家庭分担、第三组选择接手且双方同意。第三组承担半日家庭事务和一项晚间家务。</li><li>邻里照料合计4分，男方可承担0—4分。男方付费须双方确认数额；改数额清除费用签名。女方全部自付可自行选择。</li><li>带工需第一组经验不足2点，第四组提供支持，第一组实际实践，第一、三组均同意。组织成本减1，学习负担减1，指导者负担加1，不额外记工。</li><li>每轮重新签约。第二组条件不匹配时，按其备用自己处理家庭事务，或自付4分请邻里照料；第三组家庭分担未执行时，按其备用接受派工或只接重活。</li><li>双方已签但行动不匹配，不扣费用、不执行额外责任。四组确认各自行动，不能以多数票强迫其他组承担责任。</li></ul>
<h3>经验与负担</h3><p>实际完成半日重活实践，每轮经验＋1，最高3点，不因暂停而消失。本轮开始已达2点并继续实践，才形成正式岗位。只申请或支持闲置不加经验。</p><table><tr><th>小组</th><th>当轮负担增加</th></tr><tr><td>第一组</td><td>普通劳动＋2；学习重活＋3，实际带工降为＋2；正式岗位＋2；半天出工与休整＋1。</td></tr><tr><td>第二组</td><td>自己处理家庭事务＋3；邻里或集体照料＋2；家庭分担＋1。</td></tr><tr><td>第三组</td><td>接受派工或只接重活＋1；家庭分担＋3；实际带工另＋1。</td></tr></table><p>累计负担0—3点标记较低，4—6点持续存在，7点及以上较重积累。是课堂指数，不等于小时数或健康情况。</p>
<h3>四组账目</h3><p>每轮显示本轮工分和累计前后变化、出工与家庭事务、费用、经验和负担、资源及支持闲置。夫妻合计为第二、三组净得之和。费用分担只改变个人净得，不改变邻里服务的4分家庭总支出。</p><p>邻里照料收到家庭转付4分；实际使用集体照料时，示范账另记照料人员4分。集体记工＝三位社员毛工分＋实际集体照料记工，也等于三位社员净得＋邻里转付＋集体照料记工。不直接等同新增粮食或财富。</p>
<h3>长期结局</h3><p>八类主结局依次判断：①从未覆盖两组；②曾覆盖后回退；③第三轮覆盖但主要照料者最多一轮全天出工；④全天出工增加但个人累计净得不足18分；⑤所得改善而评工或岗位未稳；⑥机会回报改善而照料缺少连续支持；⑦支持持续、本轮家庭分担；⑧支持持续、本轮集体服务。</p><p>较后四类须第二组至少两轮全天出工且净得至少18分。第⑥—⑧类还须两组统一评工至少两轮并延续至第三轮、第一组第三轮取得正式岗位。连续照料支持指第二、三轮都实际采用家庭分担或集体照料，两轮方式可以不同。</p><p>结局页可查看八类主结局与四组角色结局的全部条件，逐项标记是否满足。18分是课堂观察线，不是历史贫困线。结局保留全程记录，改善不会抹去前期代价。</p>
<h3>课堂安排</h3><p>介绍约2分钟，三轮各约4分钟，结局约3分钟，回望讨论约3分钟，共约20分钟。主持人自主把握，不设置任何计时或自动提交。</p>`;}
function resetDialog(){showDialog('重新开始',`<p>重新开始将清空本机这局跨年游戏的三轮记录、协议与累计账目。</p><div class="actions">${button('取消','close')}${button('确认重新开始','reset-confirm','danger')}</div>`);}
document.addEventListener('change',event=>{const field=event.target.dataset.plan;if(!field)return;const option=CHOICES[field].find(([v])=>String(v)===event.target.value);if(!option)return;state.plan[field]=option[0];state.confirmed=[false,false,false,false];if(field==='maleFee')state.agreements.fee=[false,false];render();});
document.addEventListener('input',event=>{if(event.target.dataset.note!==undefined){state.notes[Number(event.target.dataset.note)]=event.target.value;save();}});
document.addEventListener('click',async event=>{const el=event.target.closest('[data-action]');if(!el||el.disabled)return;const action=el.dataset.action;let rerender=false;
  if(action==='start'){state.screen='round';state.step='intent';rerender=true;}
  if(action==='rules')showDialog('完整规则 · 跨年独立行动版',rulesHtml());
  if(action==='ledger'){const r=currentResult();if(r)showDialog('本轮四组账目',ledger(r,state.step!=='receipt'&&state.screen==='round'));else showDialog('开局账目','<p>三组累计工分、负担与经验均从0开始。第一轮可用组织资源6点。</p>');}
  if(action==='history')showDialog('三轮账目与协商记录',historyHtml());
  if(action==='close')dialog.close();
  if(action==='negotiate'){state.step='negotiate';rerender=true;}
  if(action==='back-intent'){state.step='intent';rerender=true;}
  if(action==='back-negotiate'){state.step='negotiate';rerender=true;}
  if(action==='confirm'&&currentResult().valid){state.step='confirm';rerender=true;}
  if(action==='agreement'){const k=el.dataset.kind,i=Number(el.dataset.signer);state.agreements[k][i]=!state.agreements[k][i];state.confirmed=[false,false,false,false];rerender=true;}
  if(action==='confirm-group'&&state.step==='confirm'&&currentResult().valid){const i=Number(el.dataset.group);state.confirmed[i]=!state.confirmed[i];rerender=true;}
  if(action==='settle'&&state.screen==='round'&&state.step==='confirm'&&state.confirmed.every(Boolean)&&currentResult().valid){state.history.push({plan:structuredClone(state.plan),agreements:structuredClone(state.agreements)});state.step='receipt';rerender=true;}
  if(action==='next'&&state.step==='receipt'&&state.history.length<3){state.step='intent';state.agreements=emptyAgreements();state.confirmed=[false,false,false,false];rerender=true;}
  if((action==='revise'&&state.step==='receipt')||(action==='revise-final'&&state.history.length===3)){const record=state.history.pop();state.plan=structuredClone(record.plan);state.agreements=structuredClone(record.agreements);state.confirmed=[false,false,false,false];state.screen='round';state.step='negotiate';rerender=true;}
  if(action==='ending'&&state.history.length===3){state.screen='ending';rerender=true;}
  if(action==='discussion'&&state.history.length===3){state.screen='discussion';rerender=true;}
  if(action==='all-endings'&&state.history.length===3){endingCategory='main';showDialog('全部结局与达成要求',allEndingsHtml());}
  if(action==='ending-category'&&state.history.length===3){endingCategory=el.dataset.category;showDialog('全部结局与达成要求',allEndingsHtml());}
  if(action==='reset')resetDialog();
  if(action==='reset-confirm'){state=freshState();dialog.close();rerender=true;}
  if(action==='fullscreen'){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{showDialog('全屏投影','<p>浏览器暂未允许网页全屏。可使用浏览器的全屏显示功能进行课堂投影。</p>');}}
  if(rerender){render();if(action==='settle')document.querySelector('.ledger-section').scrollIntoView({block:'start'});else if(!['agreement','confirm-group'].includes(action))window.scrollTo({top:0,behavior:'instant'});}
});
render();
</script></body></html>
